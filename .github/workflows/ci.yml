name: Validate Keraboss
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run verify:http
      - name: Preview indexing policy
        run: |
          CONTEXT=deploy-preview PUBLIC_INDEXABLE=true npm run build
          CONTEXT=deploy-preview PUBLIC_INDEXABLE=true npm run verify:seo
      - name: Independent training crawler policy
        run: |
          PUBLIC_GPTBOT_ALLOWED=false npm run build
          PUBLIC_GPTBOT_ALLOWED=false npm run verify:seo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-evidence
          path: |
            docs/build-audit.json
            docs/http-audit.json
            docs/design-system-checks.json
